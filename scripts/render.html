<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tag renderer</title>
    <style>
      body { margin: 0; background: #fff; }
      canvas { display: block; max-width: 100vw; height: auto; }
    </style>
  </head>
  <body>
    <!--
      Dev-only helper: renders tags as clean product shots.
      Open http://localhost:5173/scripts/render.html and call
      `await renderTag({ name: 'Smith', pattern: 'heart' })` → PNG data URL.
    -->
    <script type="module">
      import * as THREE from 'three';
      import { DEFAULTS } from '/src/defaults.js';
      import { loadFont } from '/src/fonts.js';
      import { buildTag } from '/src/geometry.js';
      import { extrude } from '/src/mesh.js';

      const W = 1600, H = 1200;
      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.append(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#ffffff');
      scene.add(new THREE.HemisphereLight(0xffffff, 0xb8b0a4, 1.5));
      const key = new THREE.DirectionalLight(0xffffff, 2.2);
      key.position.set(-160, -260, 420);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      Object.assign(key.shadow.camera, { left: -220, right: 220, top: 220, bottom: -220, near: 1, far: 1200 });
      key.shadow.radius = 6;
      scene.add(key);
      const rim = new THREE.DirectionalLight(0xffffff, 0.6);
      rim.position.set(260, 220, 200);
      scene.add(rim);

      // Soft contact shadow on an invisible floor.
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.ShadowMaterial({ opacity: 0.12 }));
      floor.receiveShadow = true;
      scene.add(floor);

      const camera = new THREE.PerspectiveCamera(30, W / H, 1, 5000);
      camera.up.set(0, 0, 1);
      const tag = new THREE.Group();
      scene.add(tag);

      window.renderTag = async (overrides = {}) => {
        const o = { ...DEFAULTS, ...overrides };
        const script = await loadFont(o.scriptFont);
        const fonts = { name: await loadFont(o.nameFont), top: script, bottom: script };
        const { bodies } = buildTag(o, fonts);
        tag.clear();
        for (const b of bodies) {
          const m = extrude(b.polys, b.z0, b.z1);
          let g = new THREE.BufferGeometry();
          g.setAttribute('position', new THREE.BufferAttribute(m.positions, 3));
          g.setIndex(new THREE.BufferAttribute(m.indices, 1));
          g = g.toNonIndexed();
          g.computeVertexNormals();
          const slot = { base: o.slotBase, tilesA: o.slotTileA, tilesB: o.slotTileB, letters: o.slotLetters, script: o.slotScript }[b.id];
          const mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: o.colors[slot - 1], roughness: 0.6 }));
          mesh.castShadow = mesh.receiveShadow = true;
          tag.add(mesh);
        }
        const dist = o.width * 1.45;
        camera.position.set(0, -dist * 0.55, dist * 0.84);
        camera.lookAt(0, 4, 0);
        renderer.render(scene, camera);
        return renderer.domElement.toDataURL('image/png');
      };
      window.rendererReady = true;
    </script>
  </body>
</html>
